<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0b1030">
<title>الصناديق السرية</title>
<meta property="og:type" content="website">
<meta property="og:title" content="الصناديق السرية">
<meta property="og:description" content="اكتب اسمك الثلاثي لتكتشف الأسرار!">
<meta property="og:image" content="https://abdullah2006adi.github.io/sanadeeq/share.jpg">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Reem+Kufi:wght@600;700&family=Tajawal:wght@500;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --gold:#f5c451;--gold-2:#ffe08a;--gold-3:#c98a1c;
    --ink:#fff8e6;--muted:#d9d0b8;--bad:#ff8a8a;--bw:min(1200px,calc(100vw - 24px));
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{font-family:'Tajawal',system-ui,-apple-system,'Segoe UI',Tahoma,sans-serif;color:var(--ink);background:#0b1030;
    min-height:100vh;min-height:100dvh;overflow-x:hidden}
  button{font:inherit}
  .hidden{display:none!important}

  /* الخلفية: صورة الصناديق نفسها مموّهة، فتتغيّر ألوان الصفحة مع كل صورة */
  .bg{position:fixed;inset:-60px;z-index:0;background:#0b1030 center/cover no-repeat;
    filter:blur(30px) saturate(1.25) brightness(.42);transform:scale(1.06)}
  .shade{position:fixed;inset:0;z-index:0;pointer-events:none;
    background:radial-gradient(ellipse at 50% 0%,transparent 0,#05081d88 75%),linear-gradient(180deg,#05081d44,#05081dcc)}
  .spark{position:fixed;bottom:-12px;z-index:0;border-radius:50%;background:#ffe08a;pointer-events:none;opacity:0;
    box-shadow:0 0 8px #ffd76a;animation:rise linear infinite}
  @keyframes rise{0%{transform:translateY(0);opacity:0}12%{opacity:.85}100%{transform:translateY(-110vh);opacity:0}}

  .screen{position:relative;z-index:1;display:none;min-height:100vh;min-height:100dvh;
    padding:max(18px,env(safe-area-inset-top)) 12px max(26px,env(safe-area-inset-bottom))}
  .screen.on{display:flex;flex-direction:column;align-items:center}

  /* ===== شاشة الاسم ===== */
  #gateScreen{justify-content:center}
  .gate{width:min(580px,100%);text-align:center;padding:26px 22px 24px;border-radius:28px;
    background:linear-gradient(180deg,#1d2766dd,#0f1540ee);border:1.5px solid #f5c45166;
    box-shadow:0 30px 80px #000a,inset 0 1px 0 #ffffff1f;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
  .gate .chest{display:block;width:108px;height:108px;margin:-6px auto 2px;filter:drop-shadow(0 10px 24px #f5c45166);animation:float 3s ease-in-out infinite}
  @keyframes float{50%{transform:translateY(-8px) rotate(-2deg)}}
  .title{font-family:'Reem Kufi','Tajawal',sans-serif;font-weight:700;font-size:clamp(34px,8.5vw,52px);line-height:1.3;
    background:linear-gradient(180deg,#fff4cf 10%,#f5c451 55%,#c98a1c 95%);-webkit-background-clip:text;background-clip:text;color:transparent}
  .prompt{margin:10px 0 20px;font-size:clamp(19px,4.8vw,24px);font-weight:800;color:var(--gold-2)}
  .fields{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
  .field label{display:block;margin-bottom:6px;font-size:14.5px;font-weight:700;color:var(--muted)}
  .field input{width:100%;font:inherit;font-size:clamp(17px,4.4vw,21px);font-weight:800;text-align:center;color:#1c1606;
    background:#fffaf0;border:2.5px solid #f5c45155;border-radius:14px;padding:12px 6px;outline:none;transition:border-color .2s,box-shadow .2s}
  .field input:focus{border-color:var(--gold);box-shadow:0 0 0 4px #f5c45140}
  .field input.ok{border-color:#7ee08fbb}
  .field input.bad{border-color:var(--bad);box-shadow:0 0 0 4px #ff8a8a33;animation:shake .4s}
  .hint{min-height:26px;margin:12px 0 6px;font-size:15px;font-weight:700;line-height:1.55;color:#ffc6c6}
  .hint.info{color:var(--muted)}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:16px;cursor:pointer;
    padding:14px 26px;font-weight:900;font-size:20px;color:#3a2300;background:linear-gradient(180deg,#ffe7a0,#f5b52e);
    box-shadow:0 6px 0 #a86f0e,0 12px 26px #0006;transition:transform .1s,box-shadow .1s,filter .2s;-webkit-tap-highlight-color:transparent}
  .btn:active{transform:translateY(4px);box-shadow:0 2px 0 #a86f0e,0 6px 12px #0006}
  .btn[disabled]{cursor:not-allowed;filter:grayscale(.85) brightness(.92);box-shadow:0 6px 0 #8a7a5a,0 8px 18px #0003}
  .btn[disabled]:active{transform:none}
  #enterBtn{width:100%}
  @media (max-width:359px){.fields{grid-template-columns:1fr}}

  /* ===== لوحة الصناديق ===== */
  #playScreen{justify-content:center}
  .top{width:var(--bw);display:flex;align-items:center;justify-content:space-between;gap:8px 16px;flex-wrap:wrap;margin-bottom:8px}
  .hello{font-size:clamp(18px,4.6vw,26px);font-weight:800}
  .hello b{color:var(--gold-2)}
  .top-end{display:flex;align-items:center;gap:8px}
  .mute{width:40px;height:40px;flex:none;display:grid;place-items:center;border-radius:50%;border:1px solid #ffffff2e;background:#ffffff14;
    font-size:19px;line-height:1;cursor:pointer;-webkit-tap-highlight-color:transparent;transition:background .2s}
  .mute:hover{background:#ffffff26}
  .mute.off{opacity:.7}
  .pill{display:flex;align-items:center;gap:10px;padding:6px 14px;border-radius:99px;background:#ffffff14;border:1px solid #ffffff26;font-weight:800;font-size:15px}
  .bar{width:110px;height:10px;border-radius:9px;background:#ffffff26;overflow:hidden}
  .bar i{display:block;height:100%;width:0;border-radius:9px;background:linear-gradient(90deg,#f5b52e,#ffe08a);transition:width .7s cubic-bezier(.2,.8,.2,1)}
  .sub{width:var(--bw);min-height:1.6em;margin-bottom:10px;text-align:center;font-weight:800;color:var(--gold-2);font-size:clamp(15px,3.9vw,19px)}
  .board{position:relative;width:var(--bw);border-radius:18px;overflow:hidden;background:#0b1030;
    box-shadow:0 26px 70px #000b,0 0 0 2px #f5c45155;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
  .board>img{display:block;width:100%;height:auto;pointer-events:none}
  .spot{position:absolute;border:0;padding:0;background:transparent;border-radius:12%;cursor:pointer;
    -webkit-tap-highlight-color:transparent;transition:transform .25s,box-shadow .25s,background-color .25s}
  .spot.live{animation:breathe 3.4s ease-in-out infinite;animation-delay:var(--d,0s)}
  @keyframes breathe{0%,100%{box-shadow:0 0 0 0 #ffd76a00}50%{box-shadow:0 0 26px 2px #ffd76a70}}
  @media (hover:hover){.spot.live:hover{transform:translateY(-2%) scale(1.04);background:#ffe08a14;box-shadow:0 0 0 3px #ffe08acc,0 0 34px 10px #ffd76a88}}
  .spot:focus-visible{outline:3px solid #ffe08a;outline-offset:2px}
  .spot.seen{background:#070b24a8}
  .spot.locked{cursor:not-allowed;background:#070b2466}
  .spot.opening{z-index:2;animation:unlock .7s ease both;background:#fff3c426;box-shadow:0 0 0 3px #fff3c4,0 0 50px 18px #ffd76aaa}
  @keyframes unlock{15%{transform:rotate(-4deg) scale(1.05)}30%{transform:rotate(4deg) scale(1.08)}45%{transform:rotate(-3deg) scale(1.1)}60%{transform:rotate(2deg) scale(1.12)}100%{transform:scale(1.15)}}
  .spot.shake{animation:shake .45s}
  @keyframes shake{20%,60%{transform:translateX(-4%)}40%,80%{transform:translateX(4%)}}
  .spot .tick,.spot .lock{display:none;position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:34%;aspect-ratio:1;border-radius:50%;
    align-items:center;justify-content:center;box-shadow:0 4px 14px #0009}
  .spot .tick{background:radial-gradient(circle at 35% 30%,#c4f9cd,#37b653);color:#06381a;font-weight:900;font-size:clamp(11px,2.6vw,32px)}
  .spot .lock{width:28%;background:#0d1238e6;border:2px solid #f5c45188}
  .spot .lock svg{width:55%;height:55%}
  .spot.seen .tick,.spot.locked .lock{display:flex}
  .spot .num{position:absolute;top:-4%;left:50%;transform:translateX(-50%);min-width:1.9em;padding:.08em .45em;border-radius:99px;
    font:900 clamp(11px,2.2vw,24px)/1.35 'Tajawal',sans-serif;color:#3a2300;background:linear-gradient(180deg,#ffe7a0,#f0a91f);
    border:2px solid #fff8;box-shadow:0 3px 10px #0009}
  .rotate-tip{display:none;margin-top:12px;font-size:14px;color:var(--muted)}
  @media (max-width:640px) and (orientation:portrait){.rotate-tip{display:block}}
  .done{margin-top:16px;padding:12px 22px;border-radius:18px;text-align:center;font-weight:900;font-size:clamp(18px,4.6vw,24px);
    color:#c8ffd1;background:#0e3b2266;border:1.5px solid #7ee08f66}
  @media (max-height:520px) and (orientation:landscape){
    .screen{padding-top:8px;padding-bottom:10px}
    .top{margin-bottom:4px}.hello{font-size:18px}.sub{font-size:14px;margin-bottom:6px}.rotate-tip{display:none}
  }

  /* ===== الصندوق المفتوح ===== */
  .modal{position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;padding:16px;
    background:#03061acc;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
  .modal.on{display:flex}
  .rays{position:absolute;left:50%;top:50%;width:1000px;height:1000px;margin:-500px 0 0 -500px;pointer-events:none;opacity:.32;border-radius:50%;
    background:repeating-conic-gradient(from 0deg,#f5c45166 0 7deg,transparent 7deg 20deg);
    -webkit-mask:radial-gradient(closest-side,#000 25%,transparent);mask:radial-gradient(closest-side,#000 25%,transparent);animation:spin 22s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .card{position:relative;width:min(660px,100%);max-height:calc(100vh - 32px);max-height:calc(100dvh - 32px);overflow:auto;text-align:center;
    color:#2a1d05;background:linear-gradient(180deg,#fffdf6,#fff0cc);border:4px solid var(--gold);border-radius:28px;padding:24px 22px 20px;
    box-shadow:0 30px 90px #000d,0 0 70px #f5c45155;animation:pop .6s cubic-bezier(.2,1.5,.35,1)}
  @keyframes pop{from{transform:scale(.35) rotate(-6deg);opacity:0}}
  .ribbon{display:inline-block;padding:5px 22px;border-radius:99px;font-family:'Reem Kufi','Tajawal',sans-serif;font-size:20px;
    color:var(--gold-2);background:linear-gradient(180deg,#26337e,#141c4a);box-shadow:0 4px 12px #0003}
  .to{margin:12px 0 8px;font-size:18px;font-weight:700;color:#7a5a14}
  .secret{font-family:'Amiri','Traditional Arabic','Times New Roman',serif;font-weight:700;font-size:clamp(23px,5.6vw,32px);line-height:1.95;
    white-space:pre-wrap;overflow-wrap:anywhere}
  .secret.long{font-size:clamp(19px,4.6vw,25px);line-height:1.85}
  .secret.xlong{font-size:clamp(17px,4.1vw,21px);line-height:1.8}
  .secret.empty{font-family:'Tajawal',sans-serif;font-weight:700;font-size:20px;color:#8a7650}
  .secret a{display:inline-block;margin:6px 0;padding:4px 14px;border-radius:99px;font-family:'Tajawal',sans-serif;font-size:17px;font-weight:800;
    color:#fff;background:#24317a;text-decoration:none}
  .secret-img{display:none;max-width:100%;max-height:46vh;margin:14px auto 0;border-radius:16px;box-shadow:0 10px 28px #0003;cursor:zoom-in}
  .foot{display:flex;align-items:center;justify-content:center;gap:16px;margin-top:20px}
  .ring{position:relative;width:62px;height:62px;flex:none}
  .ring svg{display:block;transform:rotate(-90deg)}
  .ring span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:23px;color:#24317a}
  .wait-note{min-height:1.4em;margin-top:10px;font-size:14.5px;font-weight:700;color:#8a7650}
  .skip{margin-top:6px;border:0;background:none;color:#24317a;text-decoration:underline;cursor:pointer;font-size:14px}
  .trophy{font-size:64px;line-height:1.1}
  .lightbox{position:fixed;inset:0;z-index:70;display:none;align-items:center;justify-content:center;background:#000e;padding:12px;cursor:zoom-out}
  .lightbox.on{display:flex}
  .lightbox img{max-width:100%;max-height:100%;object-fit:contain;border-radius:10px}
  .confetti{position:fixed;inset:0;pointer-events:none}
  .banner{position:fixed;top:0;left:0;right:0;z-index:90;padding:6px 12px;text-align:center;font-weight:800;font-size:14px;color:#3a2300;background:#ffe08a}
  .loading{margin-top:38vh;font-size:19px;color:var(--muted);text-align:center;line-height:1.8}
  .loading .btn{margin-top:14px;font-size:17px;padding:10px 20px}
  @media (prefers-reduced-motion:reduce){.spark,.rays{display:none}.spot.live,.gate .chest{animation:none}}
</style>
</head>
<body>
<div class="bg" id="bg"></div>
<div class="shade"></div>
<div id="sparks"></div>
<div class="banner hidden" id="previewBanner">وضع المعاينة — هذه نسخة غير منشورة لا يراها الطلاب</div>

<section class="screen on" id="loadScreen">
  <div class="loading" id="loadMsg">جارٍ تجهيز الصناديق…</div>
</section>

<section class="screen" id="gateScreen">
  <form class="gate" id="gateForm" autocomplete="off" novalidate>
    <img class="chest" src="icon.svg" alt="">
    <h1 class="title" id="gateTitle">الصناديق السرية</h1>
    <p class="prompt">اكتب اسمك الثلاثي لتكتشف الأسرار!</p>
    <div class="fields">
      <div class="field"><label for="n1">الاسم</label><input id="n1" lang="ar" dir="rtl" maxlength="20" autocapitalize="off" spellcheck="false"></div>
      <div class="field"><label for="n2">اسم الأب</label><input id="n2" lang="ar" dir="rtl" maxlength="20" autocapitalize="off" spellcheck="false"></div>
      <div class="field"><label for="n3">اسم الجد</label><input id="n3" lang="ar" dir="rtl" maxlength="20" autocapitalize="off" spellcheck="false"></div>
    </div>
    <p class="hint info" id="hint">اكتب في كل خانة اسماً واحداً بالحروف العربية</p>
    <button class="btn" id="enterBtn" type="submit">اكتشف الأسرار 🔑</button>
  </form>
</section>

<section class="screen" id="playScreen">
  <div class="top" id="top">
    <div class="hello">أهلاً يا <b id="helloName"></b> 👋</div>
    <div class="top-end">
      <div class="pill"><span id="progTxt">فتحت 0 من 10</span><div class="bar"><i id="progBar"></i></div></div>
      <button class="mute hidden" id="muteBtn" type="button" aria-label="كتم الصوت" title="كتم الصوت">🔊</button>
    </div>
  </div>
  <p class="sub" id="sub"></p>
  <div class="board" id="board"><img id="boardImg" alt="الصناديق العشرة"></div>
  <p class="rotate-tip">📱 أدر الهاتف بالعرض لتظهر الصناديق أكبر</p>
  <p class="done hidden" id="doneMsg"></p>
</section>

<div class="modal" id="secretModal" role="dialog" aria-modal="true" aria-labelledby="ribbon">
  <div class="rays"></div>
  <div class="card">
    <div class="ribbon" id="ribbon">الصندوق 1</div>
    <p class="to" id="to"></p>
    <div class="secret" id="secretText"></div>
    <img class="secret-img" id="secretImg" alt="صورة الصندوق">
    <div class="foot">
      <div class="ring" id="ring">
        <svg width="62" height="62" viewBox="0 0 62 62"><circle cx="31" cy="31" r="26" stroke="#eadcb5" stroke-width="6" fill="none"/>
          <circle id="ringArc" cx="31" cy="31" r="26" stroke="#f0a91f" stroke-width="6" fill="none" stroke-linecap="round" stroke-dasharray="163.36" stroke-dashoffset="0"/></svg>
        <span id="ringNum">10</span>
      </div>
      <button class="btn" id="closeBtn" type="button" disabled>اقرأ جيداً…</button>
    </div>
    <p class="wait-note" id="waitNote"></p>
    <button class="skip hidden" id="skipBtn" type="button">تخطَّ الانتظار (في المعاينة فقط)</button>
  </div>
</div>

<div class="modal" id="doneModal" role="dialog" aria-modal="true">
  <div class="rays"></div>
  <div class="card">
    <div class="trophy">🏆</div>
    <p class="secret" id="doneText"></p>
    <div class="foot"><button class="btn" id="doneBtn" type="button">رائع!</button></div>
  </div>
</div>

<div class="lightbox" id="lightbox"><img id="lightboxImg" alt=""></div>
<canvas class="confetti" id="confetti"></canvas>

<script>
(() => {
  "use strict";
  const $ = (id) => document.getElementById(id);
  const PREVIEW = new URLSearchParams(location.search).has("preview");
  const memory = {};
  const store = PREVIEW
    ? { get: (k, d) => (k in memory ? memory[k] : d), set: (k, v) => { memory[k] = v; } }
    : {
        get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
        set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
      };

  let cfg = null, board = null, boxes = [], seen = [], progressKey = "", student = null, busy = false;

  /* ---------- تحميل المحتوى ---------- */
  function decodeSecret(s) {
    if (!s) return [];
    if (Array.isArray(s)) return s;
    const bin = atob(s), bytes = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    return JSON.parse(new TextDecoder().decode(bytes));
  }
  async function getConfig() {
    if (PREVIEW) {
      try {
        if (window.opener && typeof window.opener.sanadeeqPreview === "function") return JSON.parse(JSON.stringify(window.opener.sanadeeqPreview()));
      } catch (e) {}
      throw new Error("preview");
    }
    const r = await fetch("config.json?t=" + Date.now(), { cache: "no-store" });
    if (!r.ok) throw new Error("http " + r.status);
    return r.json();
  }
  const asset = (src) => !src ? "" : /^(data:|blob:|https?:)/.test(src) ? src : src + (src.includes("?") ? "&" : "?") + "v=" + encodeURIComponent(cfg.version);

  /* ---------- الأصوات ----------
     cfg.sound  : صوت فتح الصناديق كلها ("" = بلا صوت). إن لم يُحدَّد فالافتراضي «بريق سحري».
     cfg.finale : صوت التهنئة بعد فتح الصناديق كلها. الافتراضي «احتفال».
     box.s      : "" = مثل باقي الصناديق، "none" = بلا صوت، أو مسار صوت خاص بهذا الصندوق. */
  const Sound = (() => {
    const AC = window.AudioContext || window.webkitAudioContext;
    let ctx = null;
    const bytes = {}, buffers = {};
    let muted = !!store.get("sanadeeq:muted", false);
    function prefetch(src) {
      if (!src || bytes[src]) return;
      bytes[src] = fetch(asset(src)).then((r) => (r.ok ? r.arrayBuffer() : null)).catch(() => null);
    }
    function decode(src) {
      if (buffers[src] || !ctx) return;
      buffers[src] = "loading";
      bytes[src].then((ab) => {
        if (!ab) { buffers[src] = null; return; }
        const done = (b) => { buffers[src] = b; }, fail = () => { buffers[src] = null; };
        try { const p = ctx.decodeAudioData(ab, done, fail); if (p && p.then) p.then(done, fail); } catch (e) { fail(); }
      });
    }
    // يُستدعى عند ضغطة الطالب على «اكتشف الأسرار» لأن المتصفحات لا تسمح بالصوت قبل لمسة من المستخدم
    function unlock() {
      if (!AC) return;
      try { if (navigator.audioSession) navigator.audioSession.type = "playback"; } catch (e) {}
      if (!ctx) { try { ctx = new AC(); } catch (e) { ctx = null; return; } }
      if (ctx.state !== "running") ctx.resume().catch(() => {});
      try { const s = ctx.createBufferSource(); s.buffer = ctx.createBuffer(1, 1, 22050); s.connect(ctx.destination); s.start(0); } catch (e) {}
      Object.keys(bytes).forEach(decode);
    }
    function play(src) {
      if (muted || !src) return;
      const b = buffers[src];
      if (ctx && b && b !== "loading") {
        if (ctx.state !== "running") ctx.resume().catch(() => {});
        const s = ctx.createBufferSource(); s.buffer = b; s.connect(ctx.destination); s.start(0);
        return;
      }
      try { const a = new Audio(asset(src)); a.play().catch(() => {}); } catch (e) {}   // احتياط إن لم يكتمل التحميل
    }
    return {
      prefetch, unlock, play,
      get muted() { return muted; },
      toggle() { muted = !muted; store.set("sanadeeq:muted", muted); return muted; }
    };
  })();
  const defaultSound = () => (cfg && "sound" in cfg ? cfg.sound || "" : "sounds/sparkle.mp3");
  const finaleSound = () => (cfg && "finale" in cfg ? cfg.finale || "" : "sounds/celebrate.mp3");
  function boxSound(i) {
    const s = (boxes[i] || {}).s;
    return s === "none" ? "" : s || defaultSound();
  }
  function renderMute() {
    const b = $("muteBtn"), m = Sound.muted;
    b.textContent = m ? "🔇" : "🔊";
    b.classList.toggle("off", m);
    b.title = m ? "تشغيل الصوت" : "كتم الصوت";
    b.setAttribute("aria-label", b.title);
  }
  $("muteBtn").addEventListener("click", () => { Sound.toggle(); renderMute(); if (!Sound.muted) Sound.unlock(); });

  async function start() {
    if (PREVIEW) { $("previewBanner").classList.remove("hidden"); document.body.style.paddingTop = "30px"; }
    try {
      cfg = await getConfig();
      boxes = decodeSecret(cfg.secret).slice(0, 10);
      while (boxes.length < 10) boxes.push({});
      board = (cfg.boards || []).find((b) => b.id === cfg.board) || (cfg.boards || [])[0];
      if (!board) throw new Error("no board");
      const title = (cfg.title || "").trim() || "الصناديق السرية";
      document.title = title;
      $("gateTitle").textContent = title;
      $("bg").style.backgroundImage = `url("${asset(board.src)}")`;
      $("boardImg").src = asset(board.src); // تحميل مسبق أثناء كتابة الاسم
      if (PREVIEW) { $("n1").value = "طالب"; $("n2").value = "تجريبي"; $("n3").value = "للمعاينة"; }
      // تنزيل الأصوات المستخدمة فقط أثناء كتابة الطالب اسمه
      const used = new Set(boxes.map((b, i) => boxSound(i)).concat(finaleSound()).filter(Boolean));
      used.forEach(Sound.prefetch);
      $("muteBtn").classList.toggle("hidden", used.size === 0);
      renderMute();
      show("gateScreen");
      setTimeout(() => { if (!matchMedia("(pointer:coarse)").matches) $("n1").focus(); }, 60);
    } catch (e) {
      $("loadMsg").innerHTML = PREVIEW
        ? "افتح المعاينة من لوحة المعلم."
        : 'تعذّر تحميل الصناديق، تأكد من اتصالك بالإنترنت.<br><button class="btn" type="button" onclick="location.reload()">إعادة المحاولة</button>';
    }
  }
  function show(id) { document.querySelectorAll(".screen").forEach((s) => s.classList.toggle("on", s.id === id)); }

  /* ---------- الاسم الثلاثي ---------- */
  const fields = [$("n1"), $("n2"), $("n3")];
  const LABELS = ["الاسم", "اسم الأب", "اسم الجد"];
  const LETTERS = "ء-غف-ي", MARKS = "ً-ْٰ";
  const RE_NOT_AR = new RegExp(`[^${LETTERS}${MARKS}\\s]`, "g");
  const HAS_NOT_AR = new RegExp(`[^${LETTERS}${MARKS}\\s]`);
  const RE_WORD = new RegExp(`^[${LETTERS}][${LETTERS}${MARKS}]*$`);
  const bare = (s) => s.replace(new RegExp(`[${MARKS}]`, "g"), "");
  const PREFIX = new Set(["عبد", "ابو", "أبو", "ابا", "أبا"]);          // عبد الله ← عبدالله
  const SUFFIX = new Set(["الله", "الدين", "الرحمن", "الرحيم"]);      // نور الدين ← نورالدين
  const normalize = (v) => v.replace(/ک/g, "ك").replace(/[یے]/g, "ي").replace(/ـ/g, "");

  function words(text) {
    const raw = text.split(/\s+/).filter(Boolean), out = [];
    for (let i = 0; i < raw.length; i++) {
      let w = raw[i];
      if (PREFIX.has(bare(w)) && i + 1 < raw.length) w += raw[++i];
      else if (out.length && SUFFIX.has(bare(w))) { out[out.length - 1] += w; continue; }
      out.push(w);
    }
    return out;
  }
  function hint(msg, isInfo) { const h = $("hint"); h.textContent = msg || ""; h.classList.toggle("info", !!isInfo); }

  fields.forEach((el, idx) => {
    el.addEventListener("input", () => {
      el.classList.remove("bad", "ok");
      let v = normalize(el.value);
      if (HAS_NOT_AR.test(v)) { v = v.replace(RE_NOT_AR, ""); hint("اكتب اسمك بالحروف العربية فقط"); }
      else hint("");
      if (/\s/.test(v)) {
        const ws = words(v);
        if (ws.length <= 1) {
          const w = ws[0] || "";
          el.value = w;
          if (PREFIX.has(bare(w))) { hint("الاسم المركّب يُكتب متصلاً في خانة واحدة، مثل: عبدالله", true); return; }
          if (w && idx < 2) fields[idx + 1].focus();
          return;
        }
        let k = idx;
        ws.forEach((w) => { if (k < 3) fields[k++].value = w; });
        if (idx + ws.length > 3) hint("الاسم الثلاثي فقط: الاسم، واسم الأب، واسم الجد");
        fields[Math.min(k, 2)].focus();
        return;
      }
      el.value = v;
    });
    el.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && idx < 2 && !e.isComposing) { e.preventDefault(); if (check(idx, false)) fields[idx + 1].focus(); else check(idx, true); }
    });
    el.addEventListener("blur", () => { if (el.value) check(idx, false) && el.classList.add("ok"); });
  });

  function check(i, report) {
    const el = fields[i], v = normalize(el.value).trim();
    let msg = "";
    if (!v) msg = `اكتب «${LABELS[i]}»`;
    else if (/\s/.test(v)) msg = "اكتب اسماً واحداً فقط في كل خانة";
    else if (!RE_WORD.test(v) || bare(v).length < 2) msg = `اكتب «${LABELS[i]}» بالحروف العربية`;
    else if (i > 0 && SUFFIX.has(bare(v))) msg = "الاسم المركّب يُكتب متصلاً في خانة واحدة، مثل: نورالدين";
    if (msg && report) {
      el.classList.remove("bad"); void el.offsetWidth; el.classList.add("bad");
      el.focus(); hint(msg);
    }
    return !msg;
  }

  $("gateForm").addEventListener("submit", (e) => {
    e.preventDefault();
    for (let i = 0; i < 3; i++) if (!check(i, true)) return;
    Sound.unlock();
    student = fields.map((f) => normalize(f.value).trim());
    progressKey = `sanadeeq:${cfg.version}:${student.join(" ")}`;
    seen = (store.get(progressKey, []) || []).filter((n) => Number.isInteger(n) && n >= 0 && n < 10);
    $("helloName").textContent = student[0];
    buildBoard();
    show("playScreen");
    fit();
  });

  /* ---------- لوحة الصناديق ---------- */
  const LOCK_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="#ffe08a" stroke-width="2.4" stroke-linecap="round"><rect x="5" y="10.5" width="14" height="10" rx="2.2" fill="#ffe08a33"/><path d="M8 10.5V7.5a4 4 0 0 1 8 0v3"/></svg>';
  const spots = [];
  function buildBoard() {
    const holder = $("board");
    spots.length = 0;
    holder.querySelectorAll(".spot").forEach((s) => s.remove());
    (board.rects || []).slice(0, 10).forEach((r, i) => {
      const s = document.createElement("button");
      s.type = "button";
      s.className = "spot";
      s.setAttribute("aria-label", "الصندوق " + (i + 1));
      s.style.cssText = `left:${r[0]}%;top:${r[1]}%;width:${r[2]}%;height:${r[3]}%;--d:${(i * 0.31).toFixed(2)}s`;
      s.innerHTML = (board.numbered ? "" : `<span class="num">${i + 1}</span>`) + '<span class="tick">✓</span><span class="lock">' + LOCK_SVG + "</span>";
      s.addEventListener("click", () => openBox(i));
      holder.appendChild(s);
      spots.push(s);
    });
    refresh();
  }
  const nextInOrder = () => { for (let i = 0; i < 10; i++) if (!seen.includes(i)) return i; return -1; };
  const isLocked = (i) => !!cfg.order && !seen.includes(i) && i !== nextInOrder();

  function refresh() {
    spots.forEach((s, i) => {
      const done = seen.includes(i), locked = isLocked(i);
      s.classList.toggle("seen", done);
      s.classList.toggle("locked", locked);
      s.classList.toggle("live", !done && !locked);
      s.setAttribute("aria-label", "الصندوق " + (i + 1) + (done ? " (فُتح)" : locked ? " (مقفل)" : ""));
    });
    const n = seen.length, total = spots.length || 10;
    $("progTxt").textContent = `فتحت ${n} من ${total}`;
    $("progBar").style.width = (n / total) * 100 + "%";
    const all = n >= total;
    $("doneMsg").classList.toggle("hidden", !all);
    if (all) {
      $("doneMsg").textContent = `🎉 أحسنت يا ${student[0]}! اكتشفت كل الأسرار`;
      $("sub").textContent = "يمكنك فتح أي صندوق مرة أخرى لتقرأه";
    } else if (cfg.order) {
      $("sub").textContent = n === 0 ? "افتح الصناديق بالترتيب، ابدأ بالصندوق رقم 1" : `أحسنت! الآن افتح الصندوق رقم ${nextInOrder() + 1}`;
    } else {
      $("sub").textContent = n === 0 ? "اضغط على أي صندوق لتكتشف ما خبّأته لك" : "أحسنت! اختر صندوقاً آخر";
    }
  }

  function fit() {
    const img = $("boardImg");
    const ratio = img.naturalWidth && img.naturalHeight ? img.naturalWidth / img.naturalHeight : 16 / 9;
    const reserved = $("top").offsetHeight + $("sub").offsetHeight + (PREVIEW ? 70 : 40);
    const byWidth = Math.min(1200, window.innerWidth - 24);
    const byHeight = (window.innerHeight - reserved) * ratio;
    const bw = Math.max(Math.min(byWidth, byHeight), Math.min(byWidth, 320));
    document.documentElement.style.setProperty("--bw", Math.floor(bw) + "px");
  }
  $("boardImg").addEventListener("load", fit);
  window.addEventListener("resize", fit);
  window.addEventListener("orientationchange", () => setTimeout(fit, 250));

  /* ---------- فتح صندوق ---------- */
  function openBox(i) {
    if (busy) return;
    const s = spots[i];
    if (isLocked(i)) {
      s.classList.remove("shake"); void s.offsetWidth; s.classList.add("shake");
      $("sub").textContent = `🔒 افتح الصندوق رقم ${nextInOrder() + 1} أولاً`;
      return;
    }
    busy = true;
    Sound.play(boxSound(i));
    s.classList.remove("live", "shake");
    s.classList.add("opening");
    setTimeout(() => { s.classList.remove("opening"); showSecret(i); }, 700);
  }

  function renderText(el, text) {
    el.textContent = "";
    const re = /https?:\/\/[^\s<>"']+/g;
    let last = 0, m;
    while ((m = re.exec(text))) {
      if (m.index > last) el.appendChild(document.createTextNode(text.slice(last, m.index)));
      const a = document.createElement("a");
      a.href = m[0]; a.target = "_blank"; a.rel = "noopener"; a.textContent = "🔗 افتح الرابط";
      el.appendChild(a);
      last = m.index + m[0].length;
    }
    if (last < text.length) el.appendChild(document.createTextNode(text.slice(last)));
  }

  let timer = null, remaining = 0, total = 0, lastTick = 0, current = -1;
  function showSecret(i) {
    current = i;
    const box = boxes[i] || {};
    const text = String(box.t || "").trim(), img = String(box.i || "");
    const empty = !text && !img;
    const already = seen.includes(i);
    $("ribbon").textContent = "الصندوق " + (i + 1);
    $("to").textContent = empty ? "" : `يا ${student[0]}، هذا ما خبّأته لك:`;
    $("to").classList.toggle("hidden", empty);
    const t = $("secretText");
    t.className = "secret" + (empty ? " empty" : text.length > 380 ? " xlong" : text.length > 150 ? " long" : "");
    if (empty) t.textContent = "هذا الصندوق فارغ هذه المرة… جرّب صندوقاً آخر!";
    else renderText(t, text);
    t.classList.toggle("hidden", !empty && !text);
    const im = $("secretImg");
    if (img) { im.src = asset(img); im.style.display = "block"; } else { im.removeAttribute("src"); im.style.display = "none"; }
    $("secretModal").classList.add("on");
    $("secretModal").querySelector(".card").scrollTop = 0;
    burst(false);

    const wait = already || empty ? 0 : Math.max(0, Math.min(600, Number(cfg.wait ?? 10) || 0));
    clearTimeout(timer);
    if (wait <= 0) return finishWait();
    total = wait * 1000; remaining = total; lastTick = performance.now();
    $("ring").classList.remove("hidden");
    const b = $("closeBtn"); b.disabled = true; b.textContent = "اقرأ جيداً…";
    $("waitNote").textContent = `يمكنك الانتقال بعد ${wait} ${wait === 1 ? "ثانية" : wait === 2 ? "ثانيتين" : wait <= 10 ? "ثوانٍ" : "ثانية"}`;
    $("skipBtn").classList.toggle("hidden", !PREVIEW);
    tick();
  }
  function tick() {
    const now = performance.now();
    if (!document.hidden) remaining -= now - lastTick; // العدّاد يتوقف إذا غادر الطالب الصفحة
    lastTick = now;
    const left = Math.max(0, remaining);
    $("ringNum").textContent = Math.ceil(left / 1000);
    $("ringArc").style.strokeDashoffset = (163.36 * (1 - left / total)).toFixed(2);
    if (left <= 0) finishWait(); else timer = setTimeout(tick, 100);
  }
  document.addEventListener("visibilitychange", () => { if (!document.hidden) lastTick = performance.now(); });
  $("skipBtn").addEventListener("click", () => { remaining = 0; });

  function finishWait() {
    clearTimeout(timer);
    if (!seen.includes(current)) { seen.push(current); store.set(progressKey, seen); }
    $("ring").classList.add("hidden");
    $("waitNote").textContent = "";
    $("skipBtn").classList.add("hidden");
    const all = seen.length >= spots.length;
    const b = $("closeBtn");
    b.disabled = false;
    b.textContent = all ? "تم ✓" : cfg.order ? "إلى الصندوق التالي ←" : "تم ✓ اختر صندوقاً آخر";
    b.focus({ preventScroll: true });
    refresh();
  }
  function closeSecret() {
    if ($("closeBtn").disabled) return;
    $("secretModal").classList.remove("on");
    busy = false;
    refresh();
    if (seen.length >= spots.length && !closeSecret.celebrated) {
      closeSecret.celebrated = true;
      $("doneText").textContent = `أحسنت يا ${student[0]}!\nفتحت الصناديق كلها واكتشفت الأسرار`;
      $("doneModal").classList.add("on");
      Sound.play(finaleSound());
      burst(true);
    }
  }
  $("closeBtn").addEventListener("click", closeSecret);
  $("doneBtn").addEventListener("click", () => $("doneModal").classList.remove("on"));
  document.addEventListener("keydown", (e) => {
    if (e.key !== "Escape") return;
    if ($("lightbox").classList.contains("on")) $("lightbox").classList.remove("on");
    else if ($("secretModal").classList.contains("on")) closeSecret();
    else $("doneModal").classList.remove("on");
  });
  $("secretImg").addEventListener("click", () => { $("lightboxImg").src = $("secretImg").src; $("lightbox").classList.add("on"); });
  $("lightbox").addEventListener("click", () => $("lightbox").classList.remove("on"));

  /* ---------- زينة ---------- */
  function burst(big) {
    if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    const c = $("confetti"), x = c.getContext("2d");
    // القصاصات تتطاير حول البطاقة وخلفها، فلا تغطي العبارة
    const host = document.querySelector(".modal.on");
    if (host) host.insertBefore(c, host.querySelector(".card")); else document.body.appendChild(c);
    c.width = innerWidth; c.height = innerHeight;
    const cols = ["#f5c451", "#ffe08a", "#7ee08f", "#7fc8ff", "#ff9bd1", "#ffffff"];
    const P = Array.from({ length: big ? 240 : 90 }, () => ({
      x: c.width / 2 + (Math.random() - .5) * (big ? c.width * .4 : 60), y: c.height * (big ? .35 : .42),
      vx: (Math.random() - .5) * (big ? 24 : 15), vy: -Math.random() * (big ? 21 : 14) - 3,
      s: 5 + Math.random() * 6, r: Math.random() * 6, vr: (Math.random() - .5) * .4, c: cols[(Math.random() * cols.length) | 0]
    }));
    let f = 0;
    (function draw() {
      x.clearRect(0, 0, c.width, c.height);
      P.forEach((p) => {
        p.vy += .42; p.x += p.vx; p.y += p.vy; p.vx *= .99; p.r += p.vr;
        x.save(); x.translate(p.x, p.y); x.rotate(p.r); x.fillStyle = p.c; x.fillRect(-p.s / 2, -p.s / 3, p.s, p.s * .66); x.restore();
      });
      if (++f < (big ? 190 : 120)) requestAnimationFrame(draw); else x.clearRect(0, 0, c.width, c.height);
    })();
  }
  (function sparks() {
    if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    const box = $("sparks");
    for (let i = 0; i < 16; i++) {
      const s = document.createElement("span");
      const size = 2 + Math.random() * 3;
      s.className = "spark";
      s.style.cssText = `left:${Math.random() * 100}%;width:${size}px;height:${size}px;animation-duration:${10 + Math.random() * 10}s;animation-delay:${-Math.random() * 18}s`;
      box.appendChild(s);
    }
  })();

  start();
})();
</script>
</body>
</html>
